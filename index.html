:root {
  color-scheme: dark;
  --bg:#15171f; --panel:#20232e; --raised:#292d38; --edge:#373b46; --text:#f7f5f3;
  --muted:#bdc0cc; --sub:#a4a8b9; --lime:#d8f58c; --lav:#c6b6ec; --gold:#f1cc81;
  --body:"Work Sans",system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --mono:"Space Mono","Courier New",monospace; --poster:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-width:270px;background:radial-gradient(ellipse at 0 30%,#1d212b 0,transparent 47%),var(--bg);color:var(--text);font:400 1rem/1.5 var(--body);letter-spacing:-.025em;word-break:keep-all}
body:has(dialog[open]){overflow:hidden}
h1,h2,h3,p{margin:0}
button,select,input,textarea{font:inherit}
button{border:0;color:inherit;background:none;cursor:pointer;touch-action:manipulation}
button:disabled,select:disabled{cursor:default}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e6fba9;outline-offset:3px}
button{transition:background .15s,color .15s,border-color .15s,transform .15s}
button:not(:disabled):active{transform:translateY(1px)}
[hidden]{display:none!important}
.ic{display:inline-block;width:1.24em;height:1.24em;flex:none;vertical-align:middle;pointer-events:none}
i[data-icon]{display:inline-flex;font-style:normal;align-items:center;justify-content:center;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{width:min(100% - clamp(32px,6vw,96px),1320px);margin-inline:auto}
.mast{background:#191b24;border-bottom:1px solid #363944}
.topbar{min-height:74px;display:flex;align-items:center;gap:clamp(20px,5vw,80px)}
.brand{display:flex;align-items:center;text-align:left;gap:12px;padding:5px 0;white-space:nowrap}
.brandmark{display:grid;place-items:center;width:43px;height:43px;border-radius:12px;background:var(--lime);color:#272b1c;box-shadow:inset 0 -3px 0 #a8c66b}
.brandmark .ic{width:32px;height:32px;transform:rotate(-16deg);stroke-width:1.9}
.brandtype{display:grid;gap:1px}
.brandtype strong{font-size:1.22rem;letter-spacing:-.065em;line-height:1.22;font-weight:900}
.brandtype b{font:700 .63rem/1.35 var(--mono);letter-spacing:.17em;color:var(--lime)}
.mainnav{display:flex;align-self:stretch;align-items:stretch;gap:clamp(10px,2.2vw,36px)}
.mainnav button{position:relative;display:flex;align-items:center;gap:8px;padding:3px 3px 0;color:var(--muted);font-weight:670;font-size:.95rem;white-space:nowrap}
.mainnav button .ic{width:18px;height:18px}
.mainnav button.active{color:var(--lime)}
.mainnav button.active:after{content:"";position:absolute;height:3px;background:var(--lime);bottom:0;left:0;right:0;border-radius:3px 3px 0 0}
.mainnav button:not(.active):hover{color:white}
.utilities{margin-left:auto;display:flex;gap:7px;align-items:center}
.saveflag{display:flex;gap:7px;align-items:center;font-size:.78rem;color:#bac6b4;margin-right:9px;white-space:nowrap}
.saveflag:before{content:"";width:6px;height:6px;background:#afce91;border-radius:50%}
.saveflag.bad{color:#ffc6a9}.saveflag.bad:before{background:#ffc6a9}
.ibtn{border:1px solid var(--edge);background:#242732;width:35px;height:35px;border-radius:9px;display:inline-grid;place-items:center;padding:0;color:#d8d9e3}
.ibtn:hover,.secondary:hover,.quiet:hover{background:#343847;border-color:#616674}
.ibtn .ic{width:17px;height:17px}
.mainwrap{padding-block:24px 0}
.heading,.heading-left,.sectionline,.store-head,.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.heading{margin-bottom:16px}
.heading-left{justify-content:flex-start}
h1{font-size:clamp(1.62rem,2.4vw,2.05rem);font-weight:840;letter-spacing:-.072em;line-height:1.35}
.run-tag{font-size:.77rem;font-weight:650;padding:2px 9px;border:1px solid #474b5a;color:#c3c6d3;background:#272a36;border-radius:6px;white-space:nowrap}
.quiet,.secondary,.smallbtn,.primary,.claim-mini,.text-btn,.setting-row{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:710}
.quiet,.secondary,.smallbtn,.claim-mini{background:#2c303b;border:1px solid #464b59;border-radius:9px;color:var(--text)}
.quiet,.secondary{padding:8px 14px;min-height:38px;font-size:.9rem}
.quiet .ic,.secondary .ic{width:16px;height:16px}
.album-link{background:transparent;font-weight:650}.album-link span{color:var(--lime);font:700 .8rem var(--mono)}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.meter{display:flex;align-items:center;gap:14px;min-height:75px;padding:12px clamp(12px,1.6vw,24px);background:var(--panel);border:1px solid var(--edge);border-radius:13px;position:relative}
.meter-icon,.job-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--well);color:var(--accent)}
.meter-icon .ic{width:24px;height:24px}
.meter-label{display:block;color:var(--muted);font-size:.81rem;font-weight:550;line-height:1.35}
.meter-value{display:flex;align-items:baseline;gap:5px;font:700 clamp(1.15rem,1.65vw,1.55rem)/1.4 var(--mono);letter-spacing:-.065em;font-variant-numeric:tabular-nums}
.meter-value small{font:650 .8rem var(--body);letter-spacing:0;color:#c8cbd4}
.meter:first-child .meter-value,.meter:first-child .meter-value small{color:var(--lime)}
.workspace{display:grid;grid-template-columns:minmax(0,1.94fr) minmax(300px,1fr);gap:18px;align-items:start}
.widecol{display:grid;gap:12px;min-width:0}
.frame{background:var(--panel);border:1px solid var(--edge);border-radius:16px;min-width:0}
.deskpanel{overflow:hidden}
.mat{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;padding:15px 19px 13px;overflow:hidden;min-height:347px;background-color:#273e3b;background-image:radial-gradient(ellipse at 49% 39%,transparent 18%,#0c181a59 100%),linear-gradient(90deg,#a9cbb11a 1px,transparent 1px),linear-gradient(#a9cbb11a 1px,transparent 1px),linear-gradient(90deg,#a9cbb10e 1px,transparent 1px),linear-gradient(#a9cbb10e 1px,transparent 1px);background-size:auto,80px 80px,80px 80px,16px 16px,16px 16px}
.mat:before,.paper:after{content:"";pointer-events:none;position:absolute;inset:0;background-image:var(--grain);opacity:.14;mix-blend-mode:soft-light}
.mat:after{content:"";position:absolute;inset:8px;border:1px solid #bdd5ba24;border-radius:8px 8px 2px 2px;pointer-events:none}
.mat-head,.mat-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#c4d3c7;font-weight:650;line-height:1.35;z-index:2}
.mat-head>span,.mat-foot>span{display:inline-flex;align-items:center;gap:7px}
.mat-head>span:first-child{font-size:.82rem}
.mat-head>span:last-child{font-size:.74rem;letter-spacing:.055em;color:#c5d2c4}
.mat-head .ic{width:16px;height:16px}
.mat-foot{font-size:.78rem;font-weight:500}
.mat-foot .ic{width:15px;height:15px}
#mat-count{font-family:var(--mono);letter-spacing:0;white-space:nowrap}
#mat-count b{color:#f5f7dc}
.ticket-place{position:relative;z-index:1;display:grid;place-items:center;padding:clamp(19px,2.2vw,32px) clamp(20px,3vw,46px);flex:1;min-width:0}
#ticket-slot{width:min(100%,590px);filter:drop-shadow(3px 11px 5px #0d191b66);transform:rotate(-2deg);transform-origin:center}
@keyframes printIn{from{opacity:.3;transform:translateY(-10px) rotate(-3deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
.print-in{animation:printIn .24s ease-out}
.paper{--stub:clamp(36px,4vw,54px);position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--stub);background:var(--paper);color:var(--ink);color-scheme:light;isolation:isolate;min-width:0;border-radius:3px;mask:radial-gradient(circle at 0 7.5px,transparent 3.2px,#000 3.8px) 0 0/51% 15px repeat-y,radial-gradient(circle at 100% 7.5px,transparent 3.2px,#000 3.8px) 100% 0/51% 15px repeat-y}
.paper:after{z-index:4;opacity:.19;mix-blend-mode:multiply}
.paper-inner{padding:9px 9px 8px 13px;min-width:0}
.print-border{border:1.5px solid var(--ink);padding:6px 9px 5px;border-radius:2px;position:relative;overflow:hidden}
.ticket-band{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding:0 0 4px;font:700 .62rem/1 var(--mono);letter-spacing:.105em}
.ticket-band>span:first-child{display:inline-flex;align-items:center;gap:5px}
.ticket-band .ic{width:13px;height:13px;stroke-width:2.1}
.hero-print{display:grid;grid-template-columns:.89fr 1.2fr;position:relative;align-items:center;min-height:112px}
.hero-text{z-index:1;padding:9px 0 7px 4px;min-width:0}
.paper-name{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:30px;padding:1px 8px 2px;font-size:.75rem;line-height:1.35;font-weight:850;letter-spacing:-.05em}
.poster-name{margin-top:3px;color:var(--ink);font:italic 800 clamp(2.5rem,3.6vw,3.5rem)/.79 var(--poster);letter-spacing:-.035em;text-transform:uppercase;transform:rotate(-2deg);transform-origin:0 60%;text-shadow:1.3px 1.4px 0 var(--light);display:block}
.poster-name span{display:block}
.hero-art{width:115%;margin-left:-6%;height:clamp(101px,9.9vw,144px);display:block;pointer-events:none}
.scratch-grid{position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:7px;touch-action:none;user-select:none;min-width:0}
.cell{position:relative;display:grid;place-items:center;overflow:hidden;width:100%;height:clamp(48px,4.65vw,66px);padding:0;border:1.7px solid var(--ink);border-radius:6px;background:var(--light);color:var(--ink);user-select:none;touch-action:none}
.cell:not(:disabled):active{transform:none}
.cell:focus-visible{outline:3px solid #7b3ce1;outline-offset:-4px}
.cell canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .15s}
.cell .symbol{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;font-size:.74rem;font-weight:800}
.cell .symbol .ic{width:26px;height:26px;stroke-width:2}
.cell[data-symbol="ink"] .symbol{color:#913f47}
.cell.open canvas{opacity:0}
.cell.sealed .symbol{opacity:.32}
.cell.sealed canvas{opacity:.6}
.cell[data-small="1"] .symbol span{display:none}
.scratch-grid.wide{gap:5px}
.scratch-grid.wide .cell .symbol{flex-direction:column;gap:0;line-height:1}
.print-note{font-size:.67rem;font-weight:720;line-height:1.32;margin-top:5px;text-align:center;letter-spacing:-.025em}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;border-left:2px dashed color-mix(in srgb,var(--ink) 75%,transparent);padding:10px 4px 11px 3px;background:repeating-linear-gradient(130deg,transparent 0 3px,color-mix(in srgb,var(--ink) 7%,transparent) 3px 4px)}
.stub:before,.stub:after{content:"";position:absolute;background:#2c423c;width:13px;height:13px;border-radius:50%;left:-7px}
.stub:before{top:-7px}.stub:after{bottom:-7px}
.stub-price{font:700 .95rem/1 var(--mono);letter-spacing:-.09em;display:flex;align-items:center;gap:1px;justify-content:center}

/* 행운 인쇄소 — 발행, 정산, 설비와 계약 규칙 */
const PressGame = (() => {
  'use strict';
  const SERIES = ['달빛 골목', '파도 우체국', '별자리 관측소', '새벽 축제', '기념 특별판'];
  const PALETTES = [
    ['#c5b8f1','#30284d','#ff956d','#fff1c9'], ['#ffbba6','#532b3a','#ea6557','#fff1cb'],
    ['#a9d1a1','#263e35','#f78b61','#fff0bc'], ['#a3c9e4','#25364c','#ff9861','#f3f1cd'],
    ['#97d2cd','#213e4c','#fb8e62','#fff1c7'], ['#ffc2ad','#613842','#e0a055','#fff3d0'],
    ['#ead68e','#393825','#96bba8','#fff4d2'], ['#accde2','#243d51','#ffab70','#ebfbec'],
    ['#aea9de','#30284c','#fb9977','#fff2c6'], ['#f0b38d','#4a2b37','#e56959','#fff1c6'],
    ['#bfb7e9','#342744','#e69d76','#fff1bf'], ['#a0c6d2','#29394e','#ed9961','#fff4cf'],
    ['#edac9a','#512d36','#e58a3d','#fff1c4'], ['#b5d28f','#2c423d','#fa9b6d','#fff6c8'],
    ['#b9c7f0','#302d50','#f69c91','#fff4cc'], ['#f3cc82','#463127','#ed745e','#fff4d2'],

  const RULES = {
    pair: '같은 무늬 2개를 모으면 당첨. 3개면 잭팟!',
    trio: '같은 무늬 3개를 모으면 당첨. 4개면 잭팟!',

  const rows = [

    ['옥상 화원','Roof Garden','flower','pick',5,50,5],
    ['심야 전파','Night Signal','radio','set',5,90,9],
    ['등대 당직','Night Watch','lighthouse','boost',6,140,14],
    ['조개 우표','Shell Mail','shell','pair',4,210,19],
    ['선장의 나침반','True North','compass','set',5,320,24],
    ['유리병 편지','Bottle Post','bottle','vault',1,470,30],
    ['은빛 망원경','Silver Scope','telescope','trio',6,690,36],
    ['혜성 꼬리','Comet Tail','comet','boost',6,980,42],

    ['자정의 시계','Zero Hour','clock','set',5,1950,54],
    ['소원 등불','Wish Light','lantern','pick',5,2700,60],
    ['바람 연','Sky Letter','kite','trio',6,3800,66],
    ['아침 열기구','Daybreak','balloon','boost',6,5200,72],
    ['해돋이 인장','First Light','sun','vault',1,7200,80],

  const tickets = rows.map(([name,en,art,rule,n,price,req],id) => {
    const [paper,ink,accent,light] = PALETTES[id];
    return {id,name,en,art,rule,n,price,req,series:Math.floor(id/4),paper,ink,accent,light};
  });
  const SYMBOLS = {
    moon:['초승달','moon'],star:['별','star'],leaf:['클로버','clover'],gem:['보석','gem'],
    crown:['왕관','crown'],ink:['먹물','drop'],blank:['빈칸','dash'],double:['2배','x2'],triple:['3배','x3']
  };
  const ordinary = ['moon','star','leaf','gem'];
  const value = {moon:1, star:1.2, leaf:1.45, gem:1.8, crown:3.3, ink:-1.9, blank:0, double:0, triple:0};
  const up = [
    {name:'행운 배합',icon:'clover',info:'좋은 무늬가 인쇄될 확률이 올라갑니다.',base:45,max:8},
    {name:'넓적 동전',icon:'coin',info:'긁는 폭이 넓어지고 은박이 더 쉽게 벗겨집니다.',base:30,max:5},
    {name:'선명한 잉크',icon:'drop',info:'당첨금을 단계마다 18% 더 받습니다.',base:65,max:8},
    {name:'활자 광택제',icon:'shine',info:'활자 닦기 보상이 단계마다 12 C 늘어납니다.',base:38,max:6}
  ];
  const gear = [
    {name:'긁개 롤러',icon:'roller',info:'작업대의 은박을 한 칸씩 자동으로 긁습니다.',base:100,max:4},
    {name:'정산 집게',icon:'hand',info:'다 긁은 복권을 자동 정산합니다.',base:190,max:1},
    {name:'자동 급지기',icon:'layers',info:'정산 뒤 선택한 다음 복권을 자동 구매합니다.',base:330,max:1},
    {name:'회수 서랍',icon:'recycle',info:'폐기한 복권값의 25%씩 돌려받습니다.',base:85,max:3}
  ];
  const perks = [
    {name:'종잣돈 봉투',icon:'wallet',info:'재개장 시작금 +100 C. 구입 즉시 이번 회차에도 지급.',base:2,max:4},
    {name:'금박 조판',icon:'stamp',info:'모든 회차의 양수 당첨금 +20%.',base:3,max:5},
    {name:'숙련공의 손',icon:'hand',info:'정산할 때마다 복권 경험치 +2.',base:2,max:4},
    {name:'롤러 설계도',icon:'roller',info:'즉시 긁개 롤러를 얻고 다음 회차에도 보유합니다.',base:5,max:1},
    {name:'별빛 판권',icon:'star',info:'잭팟과 슈퍼 잭팟으로 얻는 금박 +1.',base:4,max:3},
    {name:'여백의 미',icon:'layers',info:'일찍 정산하면 남은 칸마다 당첨금 +7%.',base:3,max:3}
  ];
  const challenges = [
    {id:'short',name:'여섯 장의 마감',en:'SHORT RUN',icon:'ticket',text:'견본을 포함해 여섯 장 안에 당첨금 85 C를 모으세요.',target:85,start:55,cap:2,limit:6,reward:3,gate:5},
    {id:'smudge',name:'번지는 잉크',en:'INK BLEED',icon:'drop',text:'무늬 일부가 빈칸으로 인쇄됩니다. 당첨금 220 C를 모으세요.',target:220,start:95,cap:3,reward:4,gate:10},
    {id:'parcel',name:'봉인 소포',en:'BLIND MAIL',icon:'box',text:'18 C짜리 봉투에는 무작위 복권이 들어 있습니다. 당첨금 280 C를 모으세요.',target:280,start:80,cap:3,reward:4,gate:15},
    {id:'hand',name:'손끝의 장인',en:'HAND SET',icon:'hand',text:'직접 한 칸씩 긁어 당첨금 300 C를 모으세요. 각 칸은 키보드로도 열 수 있습니다.',target:300,start:100,cap:4,reward:4,gate:20},
    {id:'debt',name:'외상 장부',en:'ON CREDIT',icon:'book',text:'발행가는 30% 오르고 당첨금은 20% 줄어듭니다. 당첨금 360 C를 모으세요.',target:360,start:140,cap:4,reward:5,gate:25},
    {id:'margin',name:'여백 수집가',en:'WHITE SPACE',icon:'layers',text:'옥상 화원에서 은박을 남긴 채 양수 당첨금을 여섯 번 정산하세요.',target:6,start:170,cap:2,fixed:2,reward:5,gate:30},
    {id:'night',name:'무인 인쇄소',en:'NIGHT SHIFT',icon:'roller',text:'롤러·집게·급지기로 여덟 장을 자동 정산하세요. 원할 때 다음 복권을 선택하세요.',target:8,start:250,cap:3,reward:6,gate:35},
    {id:'three',name:'세 칸의 약속',en:'THREE CUTS',icon:'cut',text:'한 장에 세 칸까지만 긁을 수 있습니다. 당첨금을 여섯 번 받으세요.',target:6,start:160,cap:4,reward:6,gate:40},
    {id:'fuel',name:'꺼져 가는 등대',en:'LAST LIGHT',icon:'bulb',text:'정산할 때마다 등유 1칸을 씁니다. 새 복권을 폐기하면 3칸을 채웁니다. 불이 꺼지기 전에 650 C를 모으세요.',target:650,start:210,cap:5,reward:8,gate:50}
  ];
  const sized = (n,v=0) => Array(n).fill(v);
  const challenge = s => s.contract ? challenges[s.contract.index] : null;
  const run = s => s.contract ? s.contract.run : s.main;
  const perk = (s,k) => s.contract ? 0 : s.meta.perks[k];
  function newRun(balance) {
    return {balance, gross:0, settled:0, wins:0, jackpots:0, partialWins:0, bought:0, jobs:0, fuel:6,
      seed:(Date.now()^Math.floor(Math.random()*0xffffffff))>>>0 || 1234567, selected:0, serial:0, active:null,
      xp:sized(17),ups:sized(up.length),gear:sized(gear.length),on:[true,true,true,true],journal:[]};
  }
  function random(r) {
    let n=r.seed|0; n^=n<<13; n^=n>>>17; n^=n<<5; r.seed=n>>>0; return r.seed/4294967296;
  }
  function pick(r, options) { return options[Math.floor(random(r)*options.length)]; }
  function shuffled(r, items) {
    for (let i=items.length-1;i>0;i--) {
      const j=Math.floor(random(r)*(i+1)); [items[i],items[j]]=[items[j],items[i]];
    }
    return items;
  }
  function log(r,label,delta=null,kind='info') {
    r.journal.unshift({time:Date.now(),label,delta,kind});
    r.journal.length=Math.min(14,r.journal.length);
  }
  function level(xp) {
    let n=1, used=0;
    while(n<20 && xp>=used+n*6) { used+=n*6; n++; }
    return {n,part:xp-used,target:n*6};
  }
  function unlocked(s,id) {
    if(!tickets[id]) return false;
    const c=challenge(s);
    if(c) return c.fixed!=null ? id===c.fixed : id<=c.cap;
    if(id===16) return s.meta.proofs.slice(0,16).every(v=>v>0);
    return s.meta.total>=tickets[id].req;
  }
  function price(s,id) {
    const c=challenge(s);
    if(c?.id==='parcel') return 18;
    return Math.ceil(tickets[id].price*(c?.id==='debt'?1.3:1));
  }
  function drawSymbols(r,t,first,mode) {
    if(t.rule==='final') return ['star','star','star'];
    if(first && t.id===0) return ['moon','star','moon'];
    const luck=r.ups[0]*0.035;
    const good=() => pick(r,ordinary);
    let a=[];
    if(t.rule==='pair'||t.rule==='trio') {
      a=Array.from({length:t.n}, good);
      if(random(r)<0.36+luck){
        const item=good(), count=t.rule==='pair'?2:3;
        for(let i=0;i<count;i++) a[i]=item;
        shuffled(r,a);
      }
    } else if(t.rule==='pick'||t.rule==='boost') {
      a=Array.from({length:t.n},()=>{
        const v=random(r);
        if(v<Math.max(.08,.25-luck*.52)) return 'ink';
        if(v>.98-luck*.10) return 'crown';
        return good();
      });
      if(t.rule==='boost') a[t.n-1]=pick(r,['double','double','triple','blank']);
      shuffled(r,a);
    } else if(t.rule==='set'){
      a=Array.from({length:t.n},()=>random(r)<.16-luck*.43?'blank':good());
      if(random(r)<.12+luck) a=shuffled(r,ordinary.concat(good()));
    } else {
      const v=random(r)+luck*.38;
      a=[v<.20?'blank':v<.37?'moon':v<.64?'star':v<.82?'leaf':v<.978?'gem':'crown'];
    }
    if(mode==='smudge') a=a.map(k=>random(r)<.20?'blank':k);
    return a;
  }
  const countOpen = t => t ? t.open.reduce((a,v)=>a+Number(v),0) : 0;
  function maxOpen(s,t) { return challenge(s)?.id==='three'?Math.min(3,t.open.length):t.open.length; }
  function issue(s,requested=run(s).selected,gift=false) {
    const r=run(s), c=challenge(s);
    if(s.contract?.status!=='live' && s.contract) return false;
    if(r.active?.status==='open'||!unlocked(s,requested)||c?.limit && r.bought>=c.limit) return false;
    const cost=gift?0:price(s,requested);
    if(r.balance<cost) return false;
    const id=c?.id==='parcel' ? Math.floor(random(r)*(c.cap+1)) : requested;
    const t=tickets[id]; r.balance-=cost; r.serial++; r.bought++;
    r.active={id,no:r.serial,price:cost,status:'open',symbols:drawSymbols(r,t,gift,c?.id),
      open:sized(t.n,false),masks:Array.from({length:t.n},()=>sized(12)),result:null};
    return true;
  }
  function newGame() {
    const s={version:1,settings:{sound:true},meta:{foil:0,total:0,earned:0,jackpots:0,restarts:0,proofs:sized(17),perks:sized(perks.length),cleared:sized(challenges.length,false),ending:false},
      main:newRun(100),contract:null};
    issue(s,0,true); log(s.main,'달토끼 급행 견본이 도착했어요.'); return s;
  }
  function reveal(s,i) {
    const r=run(s),t=r.active;
    if(!t||t.status!=='open'||!Number.isInteger(i)||i<0||i>=t.open.length||t.open[i]||countOpen(t)>=maxOpen(s,t)) return false;
    t.open[i]=true; return true;
  }
  function quote(s) {
    const r=run(s),t=r.active;
    if(!t) return {cash:0,rank:0};
    if(t.status!=='open') return t.result||{cash:0,rank:0};
    const d=tickets[t.id], seen=t.symbols.filter((_,i)=>t.open[i]), counts={};
    for(const k of seen) counts[k]=(counts[k]||0)+1;
    let f=0,rank=0;
    if(d.rule==='pair'||d.rule==='trio') {
      const req=d.rule==='pair'?2:3;
      for(const k of ordinary) {
        const qty=counts[k]||0;
        if(qty<req)continue;
        let pot=(1.65+value[k]*.35)*(qty-req+1);
        if(qty>req) {rank=Math.max(rank,qty>=req+2?2:1); pot*=1.5;}
        f+=pot;
      }
    } else if(d.rule==='set') {
      const distinct=ordinary.filter(k=>counts[k]).length;
      if(distinct>=3){f=distinct===4?4.1:1.9;rank=distinct===4?1:0;}
    } else if(d.rule==='pick'||d.rule==='boost'){
      f=seen.reduce((sum,k)=>sum+(value[k]||0),0)*(d.rule==='pick'?.54:.42);
      f*=Math.pow(2,counts.double||0)*Math.pow(3,counts.triple||0);
      if(f>=6)rank=2;else if(f>=3.5)rank=1;
    } else if(d.rule==='vault'&&seen.length) {
      f=({blank:0,moon:.65,star:1.4,leaf:2.4,gem:4.8,crown:10})[seen[0]]||0;
      rank=seen[0]==='crown'?2:seen[0]==='gem'?1:0;
    } else if(d.rule==='final'&&seen.length===3){f=9;rank=2;}
    if(f>0) {
      f*=1+(level(r.xp[t.id]).n-1)*.10+r.ups[2]*.18+perk(s,1)*.20;
      f*=1+(d.n-seen.length)*perk(s,5)*.07;
      if(challenge(s)?.id==='debt') f*=.8;
    }
    return {cash:Math.round(d.price*f),rank};
  }
  function goalProgress(s) {
    const c=challenge(s),r=run(s);
    if(c?.id==='margin')return r.partialWins;
    if(c?.id==='night')return r.settled;
    if(c?.id==='three')return r.wins;
    return r.gross;
  }
  function checkContract(s) {
    const c=challenge(s); if(!c||s.contract.status!=='live')return;
    const r=run(s);
    if(goalProgress(s)>=c.target){
      s.contract.status='won'; s.contract.prize=s.meta.cleared[s.contract.index]?0:c.reward;
      s.meta.foil+=s.contract.prize; s.meta.cleared[s.contract.index]=true;
    } else if(c.limit && r.bought>=c.limit && r.active?.status!=='open' || c.id==='fuel'&&r.fuel<=0){
      s.contract.status='lost';
    }
  }
  function settle(s) {
    const r=run(s),t=r.active;
    if(!t||t.status!=='open'||!countOpen(t)) return null;
    if(tickets[t.id].rule==='final' && countOpen(t)<t.open.length) return null;
    const result=quote(s), actual=Math.max(-r.balance,result.cash);
    t.status='paid';t.result={...result,cash:actual};r.balance+=actual;r.gross+=Math.max(0,actual);
    r.settled++; if(actual>0){r.wins++;if(countOpen(t)<t.open.length)r.partialWins++;}
    const xp=2+Number(actual>0)+Number(result.rank>0)*2+perk(s,2)*2;
    r.xp[t.id]+=xp;
    if(result.rank)r.jackpots++;
    if(challenge(s)?.id==='fuel')r.fuel--;
    let firstEnding=false;
    if(!s.contract){

    const message=restoring?'이 브라우저의 진행 상황을 복원할 코드로 교체해요.':'내용 전체를 복사해 '+(source?'UTF-8 형식의 .html 파일로 저장하세요.':'보관하세요.');
    modal(restoring?'저장 코드 불러오기':source?'전체 HTML 코드':'진행 상황 백업','<p class="dialog-copy">'+message+'</p><textarea id="code-field" spellcheck="false" aria-label="'+(source?'전체 HTML 코드':'저장 코드')+'" '+(restoring?'':'readonly')+'></textarea><div class="inline-error" id="code-error" role="alert"></div><div class="dialog-actions"><button class="secondary" data-act="settings">돌아가기</button><button class="primary" data-act="'+(restoring?'apply-code':'copy-code')+'">'+(restoring?'복원하기':'전체 복사')+'</button>'+(source?'<button class="secondary" data-act="file">'+ic('download')+'HTML 내려받기</button>':'')+'</div>',mode);
    const box=$('#code-field');box.value=restoring?'':source?gameHTML():'LP1.'+JSON.stringify(state);box.focus();if(!restoring)box.select();
  }
  function restore(){
    const raw=$('#code-field').value.trim();let x;
    try{if(raw.length>700000)throw 0;x=JSON.parse(raw.startsWith('LP1.')?raw.slice(4):raw);if(!G.valid(x))throw 0;}
    catch{$('#code-error').textContent='저장 코드를 확인해 주세요. 현재 진행 상황을 유지했어요.';return;}
    state=x;resetDesk();closeDlg();sync();toast('저장한 작업대를 복원했어요.');
    if(closedContract())contractResult();
  }
  async function copyCode(){
    const box=$('#code-field');if(!box)return;
    box.focus();box.select();
    try{if(!navigator.clipboard)throw 0;await navigator.clipboard.writeText(box.value);$('#code-error').textContent='클립보드에 복사했어요.';}
    catch{try{if(document.execCommand('copy')){$('#code-error').textContent='클립보드에 복사했어요.';return;}}catch{}
      $('#code-error').textContent='전체 내용이 선택됐어요. 브라우저의 복사 기능을 이용하세요.';}
  }
  function resetDesk(){
    scene='desk';shop='tickets';series=Math.floor(run().selected/4);renderedCard='';dragging=null;cancelSweep();lastMechanism=rollNext=performance.now();
  }
  function navigate(key){
    if(!['desk','contract','reopen'].includes(key))return;
    cancelSweep();dragging=null;scene=key;render();if(scene==='desk')drawAllFoils();
  }
  document.addEventListener('change',e=>{
    if(e.target.id==='series'){series=Number(e.target.value);storeView();paintArt($('#store-body'));$('#series').focus({preventScroll:true});}
  });
  document.addEventListener('click',e=>{
    const cell=e.target.closest('[data-cell]');
    if(cell&&e.detail===0&&!cell.disabled&&!dlg.open){updateAfterReveal(+cell.dataset.cell,'key');return;}
    const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
    const action=b.dataset.act,key=b.dataset.key,id=Number(key);
    switch(action){
      case 'nav': navigate(key);break;
      case 'shop': shop=key;render();break;
      case 'help': help();break;
      case 'album': album();break;
      case 'settings': settings();break;
      case 'sound': state.settings.sound=!state.settings.sound;sync();if(state.settings.sound)playSound('print');break;
      case 'close': closeDlg();break;
      case 'job': job();break;
      case 'sweep': sweep();break;
      case 'issue': issue();break;
      case 'claim': claim();break;
      case 'scrap':
        if(G.quote(state).cash>0){
          modal('복권을 폐기할까요?','<p class="dialog-copy">현재 예상 당첨금은 '+money(G.quote(state).cash)+'예요. 폐기하면 회수 서랍에 따른 환급액만 받습니다.</p><div class="dialog-actions"><button class="secondary" data-act="close">계속 긁기</button><button class="primary" data-act="confirm-scrap">폐기하기</button></div>','scrap');
        }else scrap();break;
      case 'confirm-scrap':closeDlg();scrap();break;
      case 'ticket-info':case 'album-info':ticketInfo(id,action==='album-info');break;
      case 'choose':{
        if(!G.select(state,id))break;
        const willIssue=run().active.status!=='open'&&con()?.id!=='night';
        closeDlg();scene='desk';series=G.tickets[id].series;
        if(willIssue)issue();else{sync();toast('다음 발행 · '+G.tickets[id].name);}
        break;
      }
      case 'buy':if(G.buy(state,shop,id)){playSound('shop');sync();toast((shop==='gear'?G.gear:G.up)[id].name+' 구매 완료');}break;
      case 'toggle-gear':if(run().gear[id]){run().on[id]=!run().on[id];sync();}break;
      case 'perk':if(G.buy(state,'perks',id)){playSound('shop');sync();toast(G.perks[id].name+' 영구 강화 완료');}break;
      case 'logs':modal('영업 일지','<div>'+run().journal.map(entryHtml).join('')+'</div><p class="help-note">이번 회차의 최근 내역 14건을 보관해요.</p>','logs');break;
      case 'reopen':
        if(!G.reopenYield(state)||state.contract)break;
        modal('새 회차로 재개장할까요?','<p class="dialog-copy">이번 작업대와 코인, 임시 장비와 복권 레벨을 초기화하고 금박 '+G.reopenYield(state)+'개를 받습니다. 도감·복권 해금·영구 강화와 도전장 기록은 계승해요.</p><div class="dialog-actions"><button class="secondary" data-act="close">취소</button><button class="primary" data-act="confirm-reopen">재개장하기</button></div>','reopen');break;
      case 'confirm-reopen':if(G.reopen(state)){closeDlg();resetDesk();sync();playSound('jack');toast('새 회차의 영업을 시작해요.');}break;
      case 'contract-enter':contractBrief(id);break;
      case 'start':if(G.enter(state,id)){closeDlg();resetDesk();sync();playSound('print');}break;
      case 'contract-status':contractStatus();break;
      case 'return-contract':closeDlg();navigate('desk');break;
      case 'abandon':
        modal('계약을 중단할까요?','<p class="dialog-copy">이번 계약의 실적을 정리하고 보관해 둔 일반 작업대로 돌아갑니다.</p><div class="dialog-actions"><button class="secondary" data-act="contract-status">계약으로</button><button class="primary" data-act="leave">중단하고 복귀</button></div>','abandon');break;
      case 'leave':if(state.contract){state.contract=null;closeDlg();resetDesk();sync();toast('일반 영업으로 돌아왔어요.');}break;
      case 'ending':ending();break;
      case 'file':downloadHTML();break;
      case 'source':case 'backup':case 'restore':codeDialog(action);break;
      case 'copy-code':copyCode();break;
      case 'apply-code':restore();break;
    }
  });
  document.addEventListener('keydown',e=>{
    if(dlg.open||e.altKey||e.ctrlKey||e.metaKey||e.repeat||scene!=='desk'||closedContract()||e.isComposing)return;
    if(e.target.matches('input,textarea,select,[contenteditable="true"]'))return;
    const key=e.key.toLowerCase();
    if(key==='s'){e.preventDefault();sweep();}
    else if(key==='w'){e.preventDefault();job();}
    else if(e.code==='Space'&&!e.target.closest('button')){
      e.preventDefault();if(run().active.status==='open')claim();else issue();
    }
  });
  setInterval(()=>{
    if(document.hidden||scene!=='desk'||dlg.open||quick||dragging||closedContract())return;
    const r=run(),t=r.active,now=performance.now();
    if(t.status==='open'){
      if(G.countOpen(t)<G.maxOpen(state,t)){
        if(!r.gear[0]||!r.on[0]||now-rollNext<Math.max(310,1450/r.gear[0]))return;
        rollNext=lastMechanism=now;updateAfterReveal(t.open.indexOf(false),'machine');
      }else if(r.gear[1]&&r.on[1]&&now-lastMechanism>=800){
        lastMechanism=now;claim('machine');
      }
    }else if(r.gear[2]&&r.on[2]&&now-lastMechanism>=1100){
      let selected=r.selected;
      if(con()?.id==='night'&&r.balance<G.price(state,selected)){
        selected=0;
        if(r.balance<G.price(state,0)){r.balance+=12;toast('야간 계약 지원금 +12 C');}
        G.select(state,selected);
      }
      if(G.issue(state,selected)){lastMechanism=rollNext=now;sync();}
    }
  },180);
  let resizeFrame=0;
  function redraw(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if(scene==='desk'){paintArt($('#desk-view'));drawAllFoils();}if(dlg.open)paintArt(dlg);});}
  window.addEventListener('resize',redraw);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelSweep();dragging=null;writeSave();}else{rollNext=lastMechanism=performance.now();render();redraw();}});
  window.addEventListener('pagehide',writeSave);
  window.addEventListener('storage',e=>{
    if(e.key!==STORAGE||!e.newValue)return;
    try{const next=JSON.parse(e.newValue);if(G.valid(next)){clearTimeout(saveTimer);dirty=false;state=next;resetDesk();if(dlg.open)closeDlg();render();if(closedContract())contractResult();}}
    catch{}
  });
  grain();render();persist();
  if(new URLSearchParams(location.search).get('view')==='source')codeDialog('source');
  else if(closedContract())contractResult();
  if(document.fonts)document.fonts.ready.then(redraw);
})();

</script>
</body></html>
